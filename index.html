<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ground Support Crew Portal</title>
<style>
:root{--blue:#1f5fae;--blue-d:#174a8a;--panel:#e6edf8;--bg:#fff;--text:#1d2733;--muted:#5b6b7d;--line:#cfd9e8;--orange:#d9822b;--card:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--blue:#5b97e6;--blue-d:#3f7fd1;--panel:#1b2a40;--bg:#0f1722;--text:#e6ecf5;--muted:#9fb0c5;--line:#2a3b55;--card:#142033}}
:root[data-theme="dark"]{--blue:#5b97e6;--blue-d:#3f7fd1;--panel:#1b2a40;--bg:#0f1722;--text:#e6ecf5;--muted:#9fb0c5;--line:#2a3b55;--card:#142033}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 Helvetica,Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column}
main{flex:1;width:100%;max-width:980px;margin:0 auto;padding:32px 20px}
.label{color:var(--orange);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
h1{margin:4px 0 2px;font-size:32px;color:var(--blue);line-height:1.15}
h2{color:var(--blue);margin:28px 0 10px;font-size:20px}
.sub{color:var(--blue);margin:0 0 20px}
.callout{background:var(--panel);border-left:4px solid var(--blue);padding:14px 16px;margin:16px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px}
label{display:block;font-size:13px;font-weight:700;margin:12px 0 4px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:inherit}
input[type=checkbox]{width:auto}
button{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:10px 18px;font:inherit;font-weight:700;cursor:pointer}
button:hover{background:var(--blue-d)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.role:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
button.ghost{background:transparent;color:var(--blue);border:1px solid var(--blue)}
button.sm{padding:5px 10px;font-size:13px}
button.danger{background:transparent;color:#c0392b;border:1px solid #c0392b}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.role{border:2px solid var(--line);border-radius:8px;padding:10px;cursor:pointer;background:var(--card)}
.role b{display:block;font-size:14px}
.role span{display:block;font-size:12px;color:var(--muted);line-height:1.35;margin-top:2px}
.role.sel{border-color:var(--blue);background:var(--panel)}
.role.sel b{color:var(--blue)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.tabs{display:flex;gap:8px;margin:18px 0 6px;flex-wrap:wrap}
.tabs button{background:var(--panel);color:var(--blue)}
.tabs button.on{background:var(--blue);color:#fff}
.badge{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:999px;background:var(--orange);color:#fff;font-size:12px;line-height:20px;text-align:center}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--blue);border-bottom:2px solid var(--blue);padding:8px}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
td input,td select{padding:6px 8px;font-size:14px}
td .acts{display:flex;gap:6px;flex-wrap:wrap}
.wrap{overflow-x:auto}
.err{color:#c0392b;font-weight:700;font-size:14px;margin-top:10px}
.muted{color:var(--muted);font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--panel);color:var(--blue);white-space:nowrap}
.pill.ok{background:#dff3e4;color:#1d6b34}
.pill.warn{background:#fdecd6;color:#9a5a12}
.pill.no{background:#f7dcd8;color:#a1291a}
.check{display:flex;align-items:center;gap:8px;font-weight:400;font-size:14px;margin:10px 0 0}
@media(max-width:600px){.grid2,.roles{grid-template-columns:1fr}}
footer{background:var(--blue);color:#fff;text-align:center;font-size:12px;font-weight:700;padding:10px 12px}
.narrow{max-width:520px;margin:0 auto}
</style>
</head>
<body>
<main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<footer>Ground Support Crew | groundsupportcrew.com</footer>
<script>
var SUPABASE_URL='https://pulbcpjwxliwnmkiyfhe.supabase.co';
var SUPABASE_KEY='sb_publishable_ljmRZCY1QvS4G64eDgTuUQ_GfWXky0x';
var sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

var view='login',role='client',err='',note='',tab='',me=null,editId=null,sugId=null,editP=null,showPast=false;
var form={};
var data={profiles:[],appts:[],companies:[],assigns:[],reqs:[]};
var NAMES={admin:'Admin',coordinator:'Coordinator',provider_company:'Provider company',provider_staff:'Provider staff',client:'Client',family:'Family'};
var YOU={admin:'the admin',coordinator:'the coordinator',provider_company:'a provider company',provider_staff:'a provider',client:'the client',family:'the family'};
var HINTS={client:'See your plan and suggest changes',family:'See a family member\'s plan',provider_company:'Your company\'s clients and staff',provider_staff:'Your own clients and sessions',coordinator:'Runs the plan and approves changes'};
var SIGNUP=['client','family','provider_company','provider_staff','coordinator'];
var WAIT={coordinator:'The admin needs to approve your account before you can see any data.',provider_company:'A coordinator or the admin needs to approve your company account before you can see any data.',provider_staff:'Your company, a coordinator or the admin needs to approve your account before you can see any data.',family:'The client or a coordinator needs to approve your access before you can see anything.',client:'A coordinator needs to approve your account before you can see anything.',admin:'This admin account is not approved yet.'};

var $=function(id){return document.getElementById(id)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var val=function(id){var e=$(id);return e?e.value.trim():''};

/* ---------- who am I ---------- */
function isAdmin(){return me&&me.role==='admin'}
function isStaff(){return me&&(me.role==='admin'||me.role==='coordinator')}
function isProv(){return me&&(me.role==='provider_company'||me.role==='provider_staff')}
function canSuggest(){return me&&(me.role==='client'||isProv()||(me.role==='family'&&me.is_representative))}

/* ---------- lookups ---------- */
function pById(id){return data.profiles.find(function(x){return x.id===id})}
function nameOf(id){var p=pById(id);return p?p.full_name:''}
function compName(id){var c=data.companies.find(function(x){return x.id===id});return c?c.name:''}
function apptById(id){return data.appts.find(function(x){return x.id===id})}
function clientsList(){return data.profiles.filter(function(p){return p.role==='client'&&p.approved})}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmt(d){if(!d)return '';var x=new Date(d+'T00:00:00');return isNaN(x)?d:x.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short',year:'numeric'})}
function opts(list,sel,labelFn,blank){return (blank?'<option value="">'+esc(blank)+'</option>':'')+list.map(function(x){return '<option value="'+esc(x.id)+'"'+(x.id===sel?' selected':'')+'>'+esc(labelFn(x))+'</option>'}).join('')}

/* ---------- sign up / log in ---------- */
function authView(){
  var s=view==='signup';
  var h='<div class="narrow"><div class="label">Portal</div><h1>'+(s?'Create your account':'Welcome back')+'</h1><p class="sub">'+(s?'Choose who you are, then sign up.':'Log in to see the plan, schedule and requests.')+'</p><div class="card">';
  if(s){
    h+='<label>I am a</label><div class="roles">'+SIGNUP.map(function(r){return '<div class="role '+(role===r?'sel':'')+'" tabindex="0" role="button" onclick="setRole(\''+r+'\')" onkeydown="if(event.key===\'Enter\')setRole(\''+r+'\')"><b>'+NAMES[r]+'</b><span>'+HINTS[r]+'</span></div>'}).join('')+'</div>';
    h+='<label>Full name</label><input id="name" autocomplete="name" value="'+esc(form.name)+'">';
    if(role==='provider_company')h+='<label>Company name</label><input id="co" value="'+esc(form.co)+'">';
  }
  h+='<label>Email</label><input id="email" type="email" autocomplete="email" value="'+esc(form.email)+'"><label>Password</label><input id="pw" type="password" autocomplete="'+(s?'new-password':'current-password')+'">';
  if(s&&role==='family')h+='<label>Client\'s email</label><input id="link" type="email" placeholder="The client must already have an account" value="'+esc(form.link)+'">';
  if(s&&role==='provider_staff')h+='<label>Your company\'s email</label><input id="link" type="email" placeholder="The email your company account uses" value="'+esc(form.link)+'">';
  if(err)h+='<div class="err">'+esc(err)+'</div>';
  if(note)h+='<div class="callout">'+esc(note)+'</div>';
  h+='<div class="row" style="margin-top:16px"><button onclick="'+(s?'doSignup()':'doLogin()')+'">'+(s?'Sign up':'Log in')+'</button><button class="ghost" onclick="go(\''+(s?'login':'signup')+'\')">'+(s?'I have an account':'Create account')+'</button></div></div></div>';
  return h;
}
function keep(){['name','email','link','co'].forEach(function(k){var e=$(k);if(e)form[k]=e.value})}
function setRole(r){keep();role=r;err='';render()}
function go(v){keep();view=v;err='';note='';render()}
async function doSignup(){
  var name=val('name'),email=val('email'),pw=$('pw').value,link=val('link'),co=val('co');
  keep();
  if(!name||!email||pw.length<6){err='Enter your name, an email and a password of 6+ characters.';return render()}
  if(role==='family'&&!link){err='Enter your client\'s email.';return render()}
  if(role==='provider_staff'&&!link){err='Enter your company\'s email.';return render()}
  if(role==='provider_company'&&!co){err='Enter your company name.';return render()}
  var meta={full_name:name,role:role};
  if(role==='family')meta.client_email=link;
  if(role==='provider_staff')meta.company_email=link;
  if(role==='provider_company')meta.company_name=co;
  var r=await sb.auth.signUp({email:email,password:pw,options:{data:meta}});
  if(r.error){
    var m=r.error.message||'';
    if(m.indexOf('Database error')>-1){
      m=role==='family'?'No client account found with that email.':role==='provider_staff'?'No provider company found with that email.':'We could not create the account. Check the details and try again.';
    }
    err=m;return render();
  }
  err='';form={};
  if(!r.data.session){note='Check your email to confirm your account, then log in.';view='login'}
  render();
}
async function doLogin(){
  keep();
  var r=await sb.auth.signInWithPassword({email:val('email'),password:$('pw').value});
  if(r.error){err='Email or password is incorrect.';return render()}
  err='';form={};
}
async function logout(){await sb.auth.signOut();me=null;tab='';view='login';err='';note='';render()}

/* ---------- load data ---------- */
async function refresh(){
  var u=(await sb.auth.getUser()).data.user;
  if(!u){me=null;tab='';return render()}
  var p=await sb.from('profiles').select('*').eq('id',u.id).single();
  me=p.data;
  if(me&&me.approved){
    var r=await Promise.all([
      sb.from('profiles').select('*').order('full_name'),
      sb.from('appointments').select('*').order('appt_date'),
      sb.from('companies').select('*').order('name'),
      sb.from('provider_assignments').select('*').order('created_at'),
      sb.from('change_requests').select('*').order('created_at',{ascending:false})
    ]);
    data.profiles=r[0].data||[];data.appts=r[1].data||[];data.companies=r[2].data||[];data.assigns=r[3].data||[];data.reqs=r[4].data||[];
  }
  if(me&&!tab)tab=isStaff()?'requests':'sched';
  render();
}
async function act(p,msg){
  var r=await p;
  if(r&&r.error){err=r.error.message;note=''}else{err='';note=msg||''}
  editId=null;sugId=null;editP=null;
  await refresh();
}
function setTab(t){tab=t;err='';note='';editId=null;sugId=null;editP=null;render()}
function togglePast(){showPast=!showPast;render()}

/* ---------- actions: schedule (coordinator and admin) ---------- */
function addAppt(){
  var c=val('ac'),t=val('at'),d=val('ad'),p=val('ap');
  if(!c||!t||!d){err='Choose a client, a date and what the appointment is.';return render()}
  act(sb.from('appointments').insert({client_id:c,title:t,appt_date:d,created_by:me.id,company_id:p||null}),'Appointment added.');
}
function delAppt(id){if(confirm('Remove this appointment?'))act(sb.from('appointments').delete().eq('id',id),'Appointment removed.')}
function startEdit(id){editId=id;render()}
function cancelEdit(){editId=null;sugId=null;render()}
function saveAppt(id){
  var d=val('ed'),t=val('et'),p=val('ep');
  if(!d||!t){err='Enter a date and what the appointment is.';return render()}
  act(sb.from('appointments').update({appt_date:d,title:t,company_id:p||null}).eq('id',id),'Appointment saved.');
}

/* ---------- actions: access and people ---------- */
function setAccess(id,ok){act(sb.rpc('set_access',{p_id:id,p_approved:ok}),ok?'Access approved.':'Access revoked.')}
function setRep(id,v){act(sb.rpc('set_representative',{p_id:id,p_value:v}),v?'Representative set.':'Representative removed.')}
function startEditP(id){editP=id;render()}
function saveP(id){
  act(sb.rpc('admin_update_profile',{p_id:id,p_full_name:val('pn'),p_role:val('pr'),p_company_id:val('pc')||null,p_approved:val('pa')==='yes'}),'Account saved.');
}

/* ---------- actions: providers ---------- */
function refillStaff(){
  var co=val('asco'),sel=$('asst');if(!sel)return;
  var st=data.profiles.filter(function(p){return p.role==='provider_staff'&&p.approved&&p.company_id===co});
  sel.innerHTML=opts(st,'',function(p){return p.full_name},'No named person yet');
}
function addAssign(){
  var c=val('asc'),co=val('asco'),sv=val('assv'),st=val('asst');
