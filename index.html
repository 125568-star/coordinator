<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ground Support Crew Portal</title>
<style>
:root{--blue:#1f5fae;--blue-d:#174a8a;--panel:#e6edf8;--bg:#fff;--text:#1d2733;--muted:#5b6b7d;--line:#cfd9e8;--orange:#d9822b;--card:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--blue:#5b97e6;--blue-d:#3f7fd1;--panel:#1b2a40;--bg:#0f1722;--text:#e6ecf5;--muted:#9fb0c5;--line:#2a3b55;--card:#142033}}
:root[data-theme="dark"]{--blue:#5b97e6;--blue-d:#3f7fd1;--panel:#1b2a40;--bg:#0f1722;--text:#e6ecf5;--muted:#9fb0c5;--line:#2a3b55;--card:#142033}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 Helvetica,Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column}
main{flex:1;width:100%;max-width:980px;margin:0 auto;padding:32px 20px}
.label{color:var(--orange);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
h1{margin:4px 0 2px;font-size:32px;color:var(--blue);line-height:1.15}
h2{color:var(--blue);margin:28px 0 10px;font-size:20px}
.sub{color:var(--blue);margin:0 0 20px}
.callout{background:var(--panel);border-left:4px solid var(--blue);padding:14px 16px;margin:16px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px}
label{display:block;font-size:13px;font-weight:700;margin:12px 0 4px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:inherit}
input[type=checkbox]{width:auto}
button{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:10px 18px;font:inherit;font-weight:700;cursor:pointer}
button:hover{background:var(--blue-d)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.role:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
button.ghost{background:transparent;color:var(--blue);border:1px solid var(--blue)}
button.sm{padding:5px 10px;font-size:13px}
button.danger{background:transparent;color:#c0392b;border:1px solid #c0392b}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.role{border:2px solid var(--line);border-radius:8px;padding:10px;cursor:pointer;background:var(--card)}
.role b{display:block;font-size:14px}
.role span{display:block;font-size:12px;color:var(--muted);line-height:1.35;margin-top:2px}
.role.sel{border-color:var(--blue);background:var(--panel)}
.role.sel b{color:var(--blue)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.tabs{display:flex;gap:8px;margin:18px 0 6px;flex-wrap:wrap}
.tabs button{background:var(--panel);color:var(--blue)}
.tabs button.on{background:var(--blue);color:#fff}
.badge{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:999px;background:var(--orange);color:#fff;font-size:12px;line-height:20px;text-align:center}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--blue);border-bottom:2px solid var(--blue);padding:8px}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
td input,td select{padding:6px 8px;font-size:14px}
td .acts{display:flex;gap:6px;flex-wrap:wrap}
.wrap{overflow-x:auto}
.err{color:#c0392b;font-weight:700;font-size:14px;margin-top:10px}
.muted{color:var(--muted);font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--panel);color:var(--blue);white-space:nowrap}
.pill.ok{background:#dff3e4;color:#1d6b34}
.pill.warn{background:#fdecd6;color:#9a5a12}
.pill.no{background:#f7dcd8;color:#a1291a}
.check{display:flex;align-items:center;gap:8px;font-weight:400;font-size:14px;margin:10px 0 0}
@media(max-width:600px){.grid2,.roles{grid-template-columns:1fr}}
footer{background:var(--blue);color:#fff;text-align:center;font-size:12px;font-weight:700;padding:10px 12px}
.narrow{max-width:520px;margin:0 auto}
</style>
</head>
