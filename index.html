<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Coordinator · Ground Support Crew</title>
<script>
(function(){var p='auto';try{p=localStorage.getItem('gsc_theme')||'auto'}catch(e){}
var d=p==='dark'||(p==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);
document.documentElement.dataset.theme=d?'dark':'light';})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0f2a5c;--blue:#1f56b8;--blue-hover:#1a4a9f;--magenta:#c8236f;--paper:#f4f6fb;--ink:#16213a;--muted:#59647f;--line:#dbe1ee;--white:#fff;--red:#b3261e;--radius:10px;--field-line:#b9c3da;--thead:#fafbfe;--dash:rgba(200,35,111,.4);--banner-bg:#fff3f8;--banner-line:#f1c3d8;--pend-bg:#fff1cf;--pend-fg:#76510a;--ok-bg:#dcf4e4;--ok-fg:#14633a;--off-bg:#eceff5;--off-fg:#4a5470;--toast-bg:#0f2a5c;--toast-fg:#fff;color-scheme:light}
:root[data-theme="dark"]{--navy:#d3e0ff;--blue:#3a72d8;--blue-hover:#2f63c4;--magenta:#ff6fae;--paper:#0d1424;--ink:#e8ecf7;--muted:#9eaacb;--line:#2a3658;--white:#16203a;--red:#ff8a80;--field-line:#40507a;--thead:#1a2644;--dash:rgba(255,111,174,.45);--banner-bg:#2a1830;--banner-line:#5a2a4c;--pend-bg:#4a3a10;--pend-fg:#ffdc82;--ok-bg:#143d28;--ok-fg:#8fe0ae;--off-bg:#26314f;--off-fg:#b7c2e0;--toast-bg:#d3e0ff;--toast-fg:#0d1424;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);font:17px/1.5 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{flex:1}
.themefooter{display:flex;align-items:center;justify-content:center;gap:24px;padding:20px 16px 24px;text-align:center}
.themefooter button{border:0;background:none;color:var(--muted);padding:4px 2px;text-decoration:underline;text-underline-offset:4px;cursor:pointer}
.themefooter button[aria-pressed="true"]{color:var(--ink);font-weight:700;text-decoration-thickness:2px}
.themefooter button:hover{color:var(--blue)}
h1,h2,h3,p{margin:0}button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--magenta);outline-offset:2px}
.brand{display:flex;align-items:center;gap:14px}.brand svg{flex:none}
.brand h1{font-size:1.55rem;line-height:1.1;color:var(--navy);letter-spacing:-.01em}
.brand .tag{color:var(--magenta);font-size:.95rem;margin-top:2px}.brand.big h1{font-size:2rem}
.top{background:var(--white);border-bottom:3px solid var(--dash);padding:12px 24px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:flex-end;font-size:.8rem}
.who{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.me{display:flex;flex-direction:column;line-height:1.2;text-align:right}.me small{color:var(--muted)}
.as{display:flex;align-items:center;gap:8px;color:var(--muted)}.as select{min-width:200px;font-size:inherit}.top .ghost.sm{font-size:inherit}
.themesel{width:auto}
.banner{background:var(--banner-bg);border-bottom:1px solid var(--banner-line);padding:10px 24px;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center}
.tabs{display:flex;gap:4px;padding:0 24px;background:var(--white);border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:4px solid transparent;padding:14px 14px 10px;cursor:pointer;color:var(--muted);font-weight:700;white-space:nowrap}
.tabs button[aria-current="page"]{color:var(--navy);border-bottom-color:var(--blue)}
.tabs .count{display:inline-block;min-width:22px;padding:0 6px;margin-left:6px;border-radius:11px;background:var(--magenta);color:var(--paper);font-size:.8rem;text-align:center}
main{max-width:1180px;margin:0 auto;padding:24px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:8px 0 14px}
.bar h2{font-size:1.3rem;color:var(--navy)}
h3.sub{font-size:1.05rem;color:var(--muted);margin:28px 0 10px}
.hint{color:var(--muted)}
.empty{background:var(--white);border:1px dashed var(--line);border-radius:var(--radius);padding:28px;text-align:center;color:var(--muted)}
.scroll{overflow-x:auto;background:var(--white);border:1px solid var(--line);border-radius:var(--radius)}
table{width:100%;border-collapse:collapse;min-width:680px}
th,td{padding:12px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{font-size:.9rem;color:var(--muted);font-weight:700;background:var(--thead)}
tr:last-child td{border-bottom:0}td.act{text-align:right;white-space:nowrap}td small{display:block;color:var(--muted)}
button{cursor:pointer}
.primary{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:10px 18px;font-weight:700}
.primary:hover{background:var(--blue-hover)}.primary:disabled{opacity:.6;cursor:wait}
.ghost{background:var(--white);border:1px solid var(--line);border-radius:8px;padding:9px 14px;font-weight:700;color:var(--navy)}
.ghost:hover{border-color:var(--blue)}.ghost.sm,.primary.sm{padding:5px 10px;font-size:.92rem}.ghost.danger{color:var(--red)}
.link{background:none;border:0;color:var(--blue);text-decoration:underline;padding:4px 0}
input,select,textarea{width:100%;background:var(--white);border:1px solid var(--field-line);border-radius:8px;padding:10px 12px}
input[type=checkbox]{width:auto}
textarea{min-height:84px;resize:vertical}
label{display:grid;gap:5px;font-weight:700}
label.check{display:flex;gap:8px;align-items:center;font-weight:400;color:var(--muted);font-size:.92rem}
.stack{display:grid;gap:14px}.msg{color:var(--red);min-height:1.2em;font-weight:700}
.links{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:14px}
.chip{display:inline-block;padding:2px 10px;border-radius:12px;font-size:.88rem;font-weight:700}
.chip.pending{background:var(--pend-bg);color:var(--pend-fg)}.chip.approved{background:var(--ok-bg);color:var(--ok-fg)}.chip.declined{background:var(--off-bg);color:var(--off-fg)}
.prov{display:flex;gap:6px;align-items:center;margin-bottom:4px}
.errbox{background:var(--banner-bg);border:1px solid var(--banner-line);border-radius:var(--radius);padding:12px 16px;margin-bottom:16px;color:var(--red);font-weight:700}
.authwrap{min-height:100vh;display:grid;place-items:center;padding:24px;position:relative}
.themecorner{position:absolute;top:16px;right:16px}
.card{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:28px}
.auth{width:100%;max-width:460px;display:grid;gap:18px}.auth h2{font-size:1.3rem;color:var(--navy)}
dialog{background:var(--white);color:var(--ink);border:0;border-radius:14px;padding:26px;width:min(520px,92vw);box-shadow:0 20px 60px rgba(15,42,92,.3)}
dialog::backdrop{background:rgba(15,42,92,.45)}
dialog h2{font-size:1.25rem;color:var(--navy);margin-bottom:14px}
.row-end{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:var(--toast-bg);color:var(--toast-fg);padding:12px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:92vw;z-index:50}
#toast.show{opacity:1;transform:translate(-50%,0)}#toast.err{background:#b3261e;color:#fff}
@media (max-width:640px){.top{padding:12px 16px}.tabs{padding:0 12px}.banner{padding:10px 16px}main{padding:16px}.me{text-align:left}.brand h1{font-size:1.3rem}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<div id="app"><p style="padding:24px">Loading…</p></div>
<footer class="themefooter" aria-label="Appearance"><button type="button" data-theme-choice="dark">Dark</button><button type="button" data-theme-choice="light">Light</button><button type="button" data-theme-choice="auto">System</button></footer>
<dialog id="dlg" aria-labelledby="dlgTitle"></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ---------- connection (the anon key is public by design; Row Level Security protects the data) ---------- */
const SUPABASE_URL = 'https://pulbcpjwxliwnmkiyfhe.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB1bGJjcGp3eGxpd25ta2l5ZmhlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE3MDYzNDksImV4cCI6MjEwNzI4MjM0OX0.skxulb3shDKFhigAL2en1qV6ePytzTHBdBrPvW3CHl0';
const TABLE = {profiles:'profiles', companies:'companies', appts:'appointments', assigns:'provider_assignments', reqs:'change_requests'};

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const ROLE_LABEL = {admin:'Admin',coordinator:'Coordinator',provider_company:'Provider company',provider_staff:'Provider staff',client:'Client',family:'Family'};
const ROLE_PLURAL = {admin:'Admins',coordinator:'Coordinators',provider_company:'Provider companies',provider_staff:'Provider staff',client:'Clients',family:'Family members'};
const ORDER = ['admin','coordinator','provider_company','provider_staff','client','family'];
const app = document.getElementById('app'), dlg = document.getElementById('dlg');
let me = null, view = null, tab = 'appointments', authMode = 'signin', loadErrs = [];
let D = {profiles:[],companies:[],appts:[],assigns:[],reqs:[]};
let recovering = /type=recovery/.test(location.hash);

/* ---------- helpers ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = d => d ? new Date(d + 'T00:00:00').toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short',year:'numeric'}) : '';
const todayStr = () => new Date().toLocaleDateString('en-CA');
function toast(m, err){
  const t = document.getElementById('toast');
  t.textContent = m; t.className = 'show' + (err ? ' err' : '');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.className = '', 4500);
}
const prof = id => D.profiles.find(x => x.id === id);
const pname = p => p ? (p.full_name || p.email) : '—';
const nameOf = id => pname(prof(id));
const compName = id => id ? (D.companies.find(x => x.id === id)?.name || 'Provider') : '—';
const isCoord = () => ['admin','coordinator'].includes(view.role);
const byRole = r => D.profiles.filter(p => p.role === r);
const opts = (list, val, label, empty, sel) => (empty != null ? `<option value="">${esc(empty)}</option>` : '') + list.map(x => `<option value="${esc(x[val])}"${x[val] === sel ? ' selected' : ''}>${esc(label(x))}</option>`).join('');
const nul = v => v === '' || v == null ? null : v;

/* ---------- theme ---------- */
function themePref(){ try { return localStorage.getItem('gsc_theme') || 'auto'; } catch(e){ return 'auto'; } }
function applyTheme(){
  const p = themePref();
  const dark = p === 'dark' || (p === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
}
function setTheme(p){ try { localStorage.setItem('gsc_theme', p); } catch(e){} applyTheme(); syncThemeFooter(); }
function syncThemeFooter(){ document.querySelectorAll('[data-theme-choice]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.themeChoice === themePref()))); }
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (themePref() === 'auto') applyTheme(); });

/* ---------- data ---------- */
async function loadAll(){
  loadErrs = [];
  await Promise.all(Object.keys(TABLE).map(async k => {
    const {data, error} = await sb.from(TABLE[k]).select('*');
    if (error) { loadErrs.push(TABLE[k] + ': ' + error.message); D[k] = []; } else D[k] = data || [];
  }));
}
async function run(p, ok){
  const {data, error} = await p;
  if (error) { toast(error.message, true); return false; }
  if (Array.isArray(data) && !data.length) { toast('Nothing changed. You may not have permission.', true); return false; }
  await loadAll(); render(); if (ok) toast(ok); return true;
}

/* ---------- boot & auth ---------- */
const logo = `<svg class="logo" width="44" height="44" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="19" fill="none" stroke="#c8236f" stroke-width="3" stroke-dasharray="5 4"/><circle cx="22" cy="22" r="11" fill="#1f56b8"/></svg>`;
const brand = big => `<div class="brand${big ? ' big' : ''}">${logo}<div><h1>Coordinator</h1><p class="tag">Ground Support Crew</p></div></div>`;
const notice = (title, text, extra) => `<div class="authwrap"><div class="card auth">${brand(true)}<h2>${title}</h2><p>${text}</p>${extra || ''}<button class="ghost" data-act="signout">Sign out</button></div></div>`;

async function boot(session){
  if (recovering) return renderRecovery();
  if (!session) { me = view = null; return renderAuth(); }
  await loadAll();
  me = prof(session.user.id);
  const errs = loadErrs.length ? `<div class="errbox">${loadErrs.map(esc).join('<br>')}</div>` : '';
  if (!me) { app.innerHTML = notice('Account not set up yet', `You are signed in as ${esc(session.user.email)}, but there is no profile for this account. Ask a coordinator to add you.`, errs); return; }
  if (me.approved === false && !['admin','coordinator'].includes(me.role)) { app.innerHTML = notice('Waiting for approval', 'A coordinator needs to approve your account before you can use the app. Check back soon.'); return; }
  view = me; render();
}

function renderAuth(){
  const t = {signin:'Sign in', signup:'Create account', forgot:'Reset password'}[authMode];
  app.innerHTML = `<div class="authwrap"><div class="card auth">${brand(true)}<h2>${t}</h2>
  <form id="af" class="stack">
  ${authMode === 'signup' ? '<label>Full name<input name="name" required autocomplete="name"></label>' : ''}
  <label>Email<input name="email" type="email" required autocomplete="email"></label>
  ${authMode !== 'forgot' ? `<label>Password<input name="pw" type="password" required minlength="8" autocomplete="${authMode==='signup'?'new-password':'current-password'}"></label>` : ''}
  <div class="msg" id="amsg" role="alert"></div><button class="primary" id="abtn">${t}</button></form>
  <div class="links">${authMode !== 'signin' ? '<button class="link" data-mode="signin">Back to sign in</button>' : '<button class="link" data-mode="signup">Create account</button><button class="link" data-mode="forgot">Forgot password?</button>'}</div></div></div>`;
  document.getElementById('af').onsubmit = async e => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(e.target)), msg = document.getElementById('amsg'), btn = document.getElementById('abtn');
    btn.disabled = true; msg.textContent = '';
    let r;
    if (authMode === 'signin') r = await sb.auth.signInWithPassword({email:f.email, password:f.pw});
    else if (authMode === 'signup') r = await sb.auth.signUp({email:f.email, password:f.pw, options:{data:{full_name:f.name}, emailRedirectTo:location.origin + location.pathname}});
    else r = await sb.auth.resetPasswordForEmail(f.email, {redirectTo:location.origin + location.pathname});
    btn.disabled = false;
    if (r.error) { msg.textContent = r.error.message; return; }
    if (authMode === 'forgot') { msg.style.color = 'var(--ok-fg)'; msg.textContent = 'Check your email for a reset link.'; }
    else if (authMode === 'signup' && !r.data.session) { msg.style.color = 'var(--ok-fg)'; msg.textContent = 'Account created. Check your email to confirm it, then sign in.'; }
  };
}

function renderRecovery(){
  app.innerHTML = `<div class="authwrap"><div class="card auth">${brand(true)}<h2>Choose a new password</h2><form id="rf" class="stack"><label>New password<input name="pw" type="password" required minlength="8" autocomplete="new-password"></label><div class="msg" id="amsg" role="alert"></div><button class="primary">Save password</button></form></div></div>`;
  document.getElementById('rf').onsubmit = async e => {
    e.preventDefault();
    const {error} = await sb.auth.updateUser({password:new FormData(e.target).get('pw')});
    if (error) { document.getElementById('amsg').textContent = error.message; return; }
    recovering = false; history.replaceState(null, '', location.pathname);
    toast('Password updated.'); boot((await sb.auth.getSession()).data.session);
  };
}

/* ---------- main view ---------- */
const pendReqs = () => D.reqs.filter(r => r.status === 'pending').length;
const pendUsers = () => D.profiles.filter(p => !p.approved).length;
function tabsFor(){
  const t = [['appointments','Appointments'], ['requests','Requests', isCoord() ? pendReqs() : 0]];
  if (isCoord()) t.push(['clients','Clients'], ['people','People', pendUsers()], ['companies','Companies']);
  return t;
}
function render(){
  if (!me) return;
  if (!tabsFor().some(t => t[0] === tab)) tab = 'appointments';
  const pr = pendReqs(), pu = pendUsers();
  app.innerHTML = `<header class="top"><div class="who">
    ${me.role === 'admin' ? `<label class="as">View as <select data-viewas>${D.profiles.map(p => `<option value="${esc(p.id)}"${p.id===view.id?' selected':''}>${esc(pname(p))} (${ROLE_LABEL[p.role]||p.role})</option>`).join('')}</select></label>` : ''}
    <div class="me"><strong>${esc(pname(view))}</strong><small>${esc(ROLE_LABEL[view.role] || view.role)}</small></div>
    <button class="ghost sm" data-act="signout">Sign out</button></div></header>
    ${isCoord() && (pr || pu) ? `<div class="banner">${pr ? `<button class="link" data-tab="requests"><strong>${pr} request${pr>1?'s':''} to review</strong></button>` : ''}${pu ? `<button class="link" data-tab="people"><strong>${pu} ${pu>1?'people':'person'} waiting for approval</strong></button>` : ''}</div>` : ''}
    <nav class="tabs" aria-label="Sections">${tabsFor().map(([k,l,c]) => `<button data-tab="${k}"${k===tab?' aria-current="page"':''}>${l}${c ? `<span class="count">${c}</span>` : ''}</button>`).join('')}</nav>
    <main>${loadErrs.length ? `<div class="errbox">Some data could not be loaded:<br>${loadErrs.map(esc).join('<br>')}</div>` : ''}${{appointments:viewAppts, requests:viewReqs, clients:viewClients, people:viewPeople, companies:viewCompanies}[tab]()}</main>`;
}

/* ----- which clients can the current view see? ----- */
function myClientIds(){
  const v = view;
  if (v.role === 'client') return [v.id];
  if (v.role === 'family') return v.linked_client ? [v.linked_client] : [];
  if (v.role === 'provider_staff') return D.assigns.filter(a => a.staff_id === v.id).map(a => a.client_id);
  if (v.role === 'provider_company') return D.assigns.filter(a => a.company_id === v.company_id).map(a => a.client_id);
  return [];
}
function myAppts(){
  let a = D.appts;
  if (!isCoord()) { const ids = myClientIds(); a = a.filter(x => ids.includes(x.client_id) || (view.role === 'provider_company' && x.company_id === view.company_id)); }
  return [...a].sort((x, y) => (x.appt_date || '').localeCompare(y.appt_date || ''));
}

/* ----- appointments ----- */
function apptTable(list){
  if (!list.length) return '<div class="empty">Nothing here.</div>';
  return `<div class="scroll"><table><thead><tr><th>Date</th><th>Appointment</th><th>Client</th><th>Provider</th>${isCoord()?'<th></th>':''}</tr></thead><tbody>${list.map(a => `<tr><td>${esc(fmtDate(a.appt_date))}</td><td><strong>${esc(a.title)}</strong></td><td>${esc(nameOf(a.client_id))}</td><td>${esc(compName(a.company_id))}</td>${isCoord()?`<td class="act"><button class="ghost sm" data-act="edit-appt" data-id="${esc(a.id)}">Edit</button> <button class="ghost sm danger" data-act="del-appt" data-id="${esc(a.id)}">Delete</button></td>`:''}</tr>`).join('')}</tbody></table></div>`;
}
function viewAppts(){
  const all = myAppts(), t = todayStr();
  const up = all.filter(a => (a.appt_date || '') >= t), past = all.filter(a => (a.appt_date || '') < t).reverse();
  return `<div class="bar"><h2>Appointments</h2>${isCoord() ? '<button class="primary" data-act="add-appt">Add appointment</button>' : ''}${['client','family'].includes(view.role) ? '<button class="primary" data-act="add-req">Request a change</button>' : ''}</div>${apptTable(up)}${past.length ? `<h3 class="sub">Past</h3>${apptTable(past)}` : ''}`;
}

/* ----- requests ----- */
function reqSummary(r){
  const ap = D.appts.find(a => a.id === r.appointment_id), nm = ap ? ap.title : 'appointment';
  if (r.action === 'add') return `Add: ${r.title} on ${fmtDate(r.appt_date)}`;
  if (r.action === 'edit') return `Change "${nm}" to: ${r.title} on ${fmtDate(r.appt_date)}`;
  return `Remove "${nm}"${ap ? ' on ' + fmtDate(ap.appt_date) : ''}`;
}
function viewReqs(){
  const ids = myClientIds();
  let list = isCoord() ? D.reqs : D.reqs.filter(r => r.requested_by === view.id || ids.includes(r.client_id));
  list = [...list].sort((a, b) => (b.created_at || '').localeCompare(a.created_at || ''));
  return `<div class="bar"><h2>Requests</h2>${['client','family'].includes(view.role) ? '<button class="primary" data-act="add-req">New request</button>' : ''}</div>${!list.length ? '<div class="empty">No requests yet.</div>' : `<div class="scroll"><table><thead><tr><th>Sent</th><th>Request</th><th>Client</th><th>From</th><th>Status</th>${isCoord()?'<th></th>':''}</tr></thead><tbody>${list.map(r => `<tr><td>${esc(r.created_at ? new Date(r.created_at).toLocaleDateString() : '')}</td><td>${esc(reqSummary(r))}${r.note ? `<small>${esc(r.note)}</small>` : ''}</td><td>${esc(nameOf(r.client_id))}</td><td>${esc(r.requester_name || nameOf(r.requested_by))}<small>${esc(ROLE_LABEL[r.requester_role] || '')}</small></td><td><span class="chip ${esc(r.status)}">${esc(r.status)}</span>${r.review_note ? `<small>${esc(r.review_note)}</small>` : ''}</td>${isCoord() ? `<td class="act">${r.status === 'pending' ? `<button class="primary sm" data-act="review" data-id="${esc(r.id)}">Review</button>` : ''}</td>` : ''}</tr>`).join('')}</tbody></table></div>`}`;
}

/* ----- clients ----- */
function viewClients(){
  const t = todayStr(), L = byRole('client');
  return `<div class="bar"><h2>Clients</h2></div>${!L.length ? '<div class="empty">No clients yet. When someone signs up, set their role to Client in People.</div>' : `<div class="scroll"><table><thead><tr><th>Client</th><th>Family</th><th>Providers</th><th>Next appointment</th><th>Requests</th><th></th></tr></thead><tbody>${L.map(c => {
    const up = D.appts.filter(a => a.client_id === c.id && (a.appt_date || '') >= t).sort((x, y) => (x.appt_date || '').localeCompare(y.appt_date || ''));
    const pend = D.reqs.filter(r => r.client_id === c.id && r.status === 'pending').length;
    const fam = D.profiles.filter(p => p.linked_client === c.id).map(pname).join(', ') || '—';
    const provs = D.assigns.filter(a => a.client_id === c.id).map(a => `<div class="prov"><span>${esc(a.service)} · ${esc(compName(a.company_id))} · ${esc(nameOf(a.staff_id))}</span><button class="ghost sm danger" data-act="del-prov" data-id="${esc(a.id)}" aria-label="Remove provider">×</button></div>`).join('') || '—';
    return `<tr><td><strong>${esc(pname(c))}</strong><small>${esc(c.email)}</small></td><td>${esc(fam)}</td><td>${provs}</td><td>${up.length ? `${esc(fmtDate(up[0].appt_date))}<small>${esc(up[0].title)} · ${up.length} upcoming</small>` : '—'}</td><td>${pend ? `<span class="chip pending">${pend} pending</span>` : '—'}</td><td class="act"><button class="ghost sm" data-act="add-appt" data-client="${esc(c.id)}">Add appointment</button> <button class="ghost sm" data-act="add-prov" data-client="${esc(c.id)}">Add provider</button></td></tr>`;
  }).join('')}</tbody></table></div>`}`;
}

/* ----- people ----- */
function viewPeople(){
  const roles = ORDER.filter(o => o !== 'admin' || me.role === 'admin');
  const body = ORDER.map(r => {
    const L = byRole(r); if (!L.length) return '';
    return `<h3 class="sub">${ROLE_PLURAL[r]}</h3><div class="scroll"><table><thead><tr><th>Name</th><th>Email</th><th>Access</th><th>Role</th><th>Linked to</th></tr></thead><tbody>${L.map(p => `<tr>
      <td>${esc(p.full_name || '—')}${['client','family'].includes(p.role) ? `<label class="check"><input type="checkbox" data-prep="${esc(p.id)}"${p.is_representative ? ' checked' : ''}> Representative</label>` : ''}</td>
      <td>${esc(p.email)}</td>
      <td>${p.approved ? '<span class="chip approved">Approved</span>' : `<button class="primary sm" data-act="approve-user" data-id="${esc(p.id)}">Approve</button>`}</td>
      <td>${p.role === 'admin' && me.role !== 'admin' ? 'Admin' : `<select data-prole="${esc(p.id)}" aria-label="Role">${roles.map(o => `<option value="${o}"${o === p.role ? ' selected' : ''}>${ROLE_LABEL[o]}</option>`).join('')}</select>`}</td>
      <td>${p.role === 'family' ? `<select data-plink="${esc(p.id)}" aria-label="Linked client">${opts(byRole('client'), 'id', pname, 'No client', p.linked_client)}</select>` : ['provider_staff','provider_company'].includes(p.role) ? `<select data-pcomp="${esc(p.id)}" aria-label="Company">${opts(D.companies, 'id', c => c.name, 'No company', p.company_id)}</select>` : '—'}</td></tr>`).join('')}</tbody></table></div>`;
  }).join('');
  return `<div class="bar"><h2>People</h2></div>${body || '<div class="empty">No people yet.</div>'}`;
}

/* ----- companies ----- */
function viewCompanies(){
  return `<div class="bar"><h2>Provider companies</h2><button class="primary" data-act="add-comp">Add company</button></div>${!D.companies.length ? '<div class="empty">No companies yet.</div>' : `<div class="scroll"><table><thead><tr><th>Name</th><th>Staff</th><th></th></tr></thead><tbody>${D.companies.map(c => `<tr><td><strong>${esc(c.name)}</strong></td><td>${esc(D.profiles.filter(p => p.company_id === c.id).map(pname).join(', ') || '—')}</td><td class="act"><button class="ghost sm danger" data-act="del-comp" data-id="${esc(c.id)}">Delete</button></td></tr>`).join('')}</tbody></table></div>`}`;
}

/* ---------- dialogs & actions ---------- */
function openDlg(title, body, submit, btns){
  dlg.innerHTML = `<h2 id="dlgTitle">${esc(title)}</h2><form id="df" class="stack">${body}<div class="row-end"><button type="button" class="ghost" data-act="close">Cancel</button>${btns || '<button class="primary">Save</button>'}</div></form>`;
  document.getElementById('df').onsubmit = async e => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(e.target)); f._s = e.submitter?.value;
    if (await submit(f)) dlg.close();
  };
  dlg.showModal();
}
async function review(r, status, note){
  if (status === 'approved') {
    const A = sb.from(TABLE.appts); let q;
    if (r.action === 'add') q = A.insert({client_id:r.client_id, title:r.title, appt_date:r.appt_date, company_id:r.company_id, created_by:me.id});
    else if (r.action === 'edit') { const u = {title:r.title, appt_date:r.appt_date}; if (r.company_id) u.company_id = r.company_id; q = A.update(u).eq('id', r.appointment_id).select(); }
    else q = A.delete().eq('id', r.appointment_id).select();
    const {data, error} = await q;
    if (error) { toast(error.message, true); return false; }
    if (Array.isArray(data) && !data.length) { toast('The appointment was not changed. You may not have permission.', true); return false; }
  }
  return run(sb.from(TABLE.reqs).update({status, review_note:nul(note), reviewed_by:me.id, reviewed_at:new Date().toISOString()}).eq('id', r.id).select(), 'Request ' + status + '.');
}
const clientOpts = sel => opts(byRole('client'), 'id', pname, 'Choose a client', sel);
const ACT = {
  signout: async () => { await sb.auth.signOut(); },
  close: () => dlg.close(),
  'add-appt': d => openDlg('Add appointment', `
    <label>Client<select name="client_id" required>${clientOpts(d.client)}</select></label>
    <label>Title<input name="title" required maxlength="200"></label>
    <label>Date<input name="appt_date" type="date" required value="${todayStr()}"></label>
    <label>Provider company<select name="company_id">${opts(D.companies, 'id', c => c.name, 'None')}</select></label>`,
    f => run(sb.from(TABLE.appts).insert({client_id:f.client_id, title:f.title, appt_date:f.appt_date, company_id:nul(f.company_id), created_by:me.id}), 'Appointment added.')),
  'edit-appt': d => { const a = D.appts.find(x => x.id === d.id); openDlg('Edit appointment', `
    <label>Title<input name="title" required maxlength="200" value="${esc(a.title)}"></label>
    <label>Date<input name="appt_date" type="date" required value="${esc(a.appt_date)}"></label>
    <label>Provider company<select name="company_id">${opts(D.companies, 'id', c => c.name, 'None', a.company_id)}</select></label>`,
    f => run(sb.from(TABLE.appts).update({title:f.title, appt_date:f.appt_date, company_id:nul(f.company_id)}).eq('id', a.id).select(), 'Appointment updated.')); },
  'del-appt': d => confirm('Delete this appointment?') && run(sb.from(TABLE.appts).delete().eq('id', d.id).select(), 'Appointment deleted.'),
  'add-req': () => {
    const cid = view.role === 'client' ? view.id : view.linked_client;
    if (!cid) return toast('Ask a coordinator to link your account to a client first.', true);
    const mine = D.appts.filter(a => a.client_id === cid);
    openDlg('New request', `
      <label>What do you need?<select name="action" data-reqaction><option value="add">Add an appointment</option><option value="edit">Change an appointment</option><option value="remove">Remove an appointment</option></select></label>
      <label data-needappt hidden>Which appointment<select name="appointment_id">${opts(mine, 'id', a => fmtDate(a.appt_date) + ' · ' + a.title, 'Choose one')}</select></label>
      <div class="stack" data-needdetails>
        <label>Title<input name="title" required maxlength="200"></label>
        <label>Date<input name="appt_date" type="date" required value="${todayStr()}"></label>
        <label>Provider company<select name="company_id">${opts(D.companies, 'id', c => c.name, 'No preference')}</select></label>
      </div>
      <label>Note<textarea name="note" maxlength="1000"></textarea></label>`,
      f => { const rm = f.action === 'remove'; return run(sb.from(TABLE.reqs).insert({client_id:cid, appointment_id:f.action === 'add' ? null : nul(f.appointment_id), action:f.action, title:rm ? null : f.title, appt_date:rm ? null : f.appt_date, company_id:rm ? null : nul(f.company_id), note:nul(f.note), requested_by:me.id, requester_name:pname(me), requester_role:me.role, status:'pending'}), 'Request sent.'); });
  },
  review: d => { const r = D.reqs.find(x => x.id === d.id); openDlg('Review request', `<p><strong>${esc(reqSummary(r))}</strong></p><p class="hint">For ${esc(nameOf(r.client_id))}, asked by ${esc(r.requester_name || nameOf(r.requested_by))}.${r.note ? ' Note: ' + esc(r.note) : ''}</p><label>Note to requester (optional)<textarea name="review_note"></textarea></label>`,
    f => review(r, f._s, f.review_note), '<button type="submit" value="declined" class="ghost">Decline</button><button type="submit" value="approved" class="primary">Approve</button>'); },
  'approve-user': d => run(sb.from(TABLE.profiles).update({approved:true}).eq('id', d.id).select(), 'Approved.'),
  'add-prov': d => openDlg('Add provider for ' + nameOf(d.client), `
    <label>Service<input name="service" required maxlength="100"></label>
    <label>Company<select name="company_id" required>${opts(D.companies, 'id', c => c.name, 'Choose a company')}</select></label>
    <label>Staff member<select name="staff_id" required>${opts(byRole('provider_staff'), 'id', p => pname(p) + ' (' + compName(p.company_id) + ')', 'Choose staff')}</select></label>`,
    f => run(sb.from(TABLE.assigns).insert({client_id:d.client, service:f.service, company_id:f.company_id, staff_id:f.staff_id}), 'Provider added.')),
  'del-prov': d => confirm('Remove this provider from the client?') && run(sb.from(TABLE.assigns).delete().eq('id', d.id).select(), 'Provider removed.'),
  'add-comp': () => openDlg('Add provider company', '<label>Company name<input name="name" required maxlength="200"></label>',
    f => run(sb.from(TABLE.companies).insert({name:f.name}), 'Company added.')),
  'del-comp': d => confirm('Delete this company?') && run(sb.from(TABLE.companies).delete().eq('id', d.id).select(), 'Company deleted.')
};
document.addEventListener('click', e => {
  const choice = e.target.closest('[data-theme-choice]'); if (choice) { setTheme(choice.dataset.themeChoice); return; }
  const a = e.target.closest('[data-act]'); if (a) return ACT[a.dataset.act]?.(a.dataset);
  const t = e.target.closest('[data-tab]'); if (t) { tab = t.dataset.tab; render(); return; }
  const m = e.target.closest('[data-mode]'); if (m) { authMode = m.dataset.mode; renderAuth(); }
});
document.addEventListener('change', e => {
  const s = e.target, P = TABLE.profiles;
  if (s.matches('[data-viewas]')) { view = prof(s.value) || me; tab = 'appointments'; render(); }
  else if (s.matches('[data-reqaction]')) {
    const f = s.form, v = s.value;
    f.querySelector('[data-needappt]').hidden = v === 'add';
    f.querySelector('[name=appointment_id]').required = v !== 'add';
    f.querySelector('[data-needdetails]').hidden = v === 'remove';
    f.querySelector('[name=title]').required = v !== 'remove';
    f.querySelector('[name=appt_date]').required = v !== 'remove';
  }
  else if (s.dataset.prole) run(sb.from(P).update({role:s.value}).eq('id', s.dataset.prole).select(), 'Role updated.');
  else if (s.dataset.pcomp) run(sb.from(P).update({company_id:nul(s.value)}).eq('id', s.dataset.pcomp).select(), 'Company updated.');
  else if (s.dataset.plink) run(sb.from(P).update({linked_client:nul(s.value)}).eq('id', s.dataset.plink).select(), 'Linked.');
  else if (s.dataset.prep) run(sb.from(P).update({is_representative:s.checked}).eq('id', s.dataset.prep).select(), 'Updated.');
});

/* ---------- never a blank page: show any error on screen ---------- */
function fatal(msg){
  if (!/Loading/.test(app.textContent)) { toast(msg, true); return; }
  app.innerHTML = `<div class="authwrap"><div class="card auth"><h2>Something went wrong</h2><div class="errbox">${esc(msg)}</div><button class="ghost" onclick="location.reload()">Reload</button></div></div>`;
}
addEventListener('error', e => fatal(e.message));
addEventListener('unhandledrejection', e => fatal(e.reason?.message || String(e.reason)));

/* ---------- start ---------- */
applyTheme();
syncThemeFooter();
sb.auth.onAuthStateChange((ev, session) => {
  if (ev === 'PASSWORD_RECOVERY') recovering = true;
  if (ev === 'INITIAL_SESSION' || ev === 'SIGNED_IN' || ev === 'SIGNED_OUT' || ev === 'PASSWORD_RECOVERY') setTimeout(() => boot(session), 0);
});
</script>
</body>
</html>
